   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #263445" transform="translate(204.730406 103.364516)">Reset: state goes to IDLE on a rising edge with rst=1. Interface signals are masked while rst=1.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #263445" transform="translate(313.165484 115.682109)">Illegal state also returns to IDLE on the next rising edge.</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #263445" transform="translate(100.390656 283.614747)">IDLE</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #263445" transform="translate(69.985969 295.932341)">start_ready = 1</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #263445" transform="translate(313.223312 278.3137)">LOAD</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #263445" transform="translate(287.848312 289.511513)">pixel_ready = 1</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #263445" transform="translate(279.945187 300.98745)">64 accepted pixels</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #263445" transform="translate(538.790219 277.608919)">EVAL8</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #263445" transform="translate(498.837875 289.926513)">32 paired MAC beats</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #263445" transform="translate(531.465766 302.244106)">per class</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #263445" transform="translate(784.778094 278.452763)">COMPARE</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #263445" transform="translate(746.460125 289.650575)">Update best score / class</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #263445" transform="translate(752.248406 300.848388)">from pending registers</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #263445" transform="translate(788.788016 455.97995)">RESULT</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #263445" transform="translate(766.185594 468.297544)">result_valid = 1</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #263445" transform="translate(756.470359 480.921075)">Class or input error</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="219.3087" y="270.457481" transform="rotate(-0 219.3087 270.457481)">start_valid</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(415.117012 220.442822)">64th pixel;</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(408.121622 230.520853)">no input error</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(653.497256 220.442822)">index = 31</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(632.747334 230.520853)">Capture score + tag</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="853.9635" y="377.196041" transform="rotate(-0 853.9635 377.196041)">pending_last</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #bd7b18" x="600.6975" y="396.113198" transform="rotate(-0 600.6975 396.113198)">More classes: advance class, reset index, preload next bias</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="492.687" y="447.227438" transform="rotate(-0 492.687 447.227438)">Invalid pixel seen: finish input collection, then return error</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="384.6765" y="510.995081" transform="rotate(-0 384.6765 510.995081)">result_ready: consume result</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="112.788" y="178.125997" transform="rotate(-0 112.788 178.125997)">Wait for command</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="326.5743" y="178.125997" transform="rotate(-0 326.5743 178.125997)">Wait / collect pixels</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="556.0035" y="178.125997" transform="rotate(-0 556.0035 178.125997)">index &lt; 31: accumulate</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(833.096 529.556005)">Hold while</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(827.67225 538.514255)">!result_ready</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #263445" transform="translate(53.196 560.077026)">Every state box names the control phase; computation and transitions occur on clock edges.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #263445" transform="translate(53.196 570.155057)">One frame is processed at a time. result_fallback is always 0 for this INT8-only engine.</text>
   </g>
  </g>
  <g id="text_19">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start" x="56.16" y="25.445344" transform="rotate(-0 56.16 25.445344)">FlexMAC: controller for registered score comparison</text>
  </g>
  <g id="text_20">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(56.16 600.411656)">Conceptual state diagram traced to flexmac_int8x2_scorepipe.v. A pixel is accepted only when pixel_valid &amp;&amp; pixel_ready.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(56.16 610.74)">An invalid raw pixel is greater than 16; collection continues until all 64 pixels have been accepted.</text>
  </g>
 </g>
