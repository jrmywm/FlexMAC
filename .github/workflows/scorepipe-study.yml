name: Score pipeline area, timing and replay
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and EDA tools
        timeout-minutes: 12
        run: bash scripts/install_ci_tools.sh timing
      - name: Cache pinned timing tools
        id: tools
        uses: actions/cache/restore@v4
        with:
          path: .tools
          key: flexmac-timing-ubuntu24-${{ hashFiles('eda/toolchain.json', 'scripts/build_timing_tools.sh') }}-v1
      - name: Build pinned CUDD and OpenSTA
        if: steps.tools.outputs.cache-hit != 'true'
        run: bash scripts/build_timing_tools.sh
      - name: Save built timing tools before running experiments
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .tools
          key: flexmac-timing-ubuntu24-${{ hashFiles('eda/toolchain.json', 'scripts/build_timing_tools.sh') }}-v1
      - name: Verify models, constraints and RTL references
        run: |
          python -m unittest discover -s tests -v
          bash scripts/check_scorepipe.sh
      - name: Map frozen engines and directly test setup brackets and common clock
        env:
          STA: ${{ github.workspace }}/.tools/OpenSTA/build/sta
        run: python scripts/check_mapping.py --study eda/scorepipe_study.json
      - name: Record source history and tools
        if: always()
        run: |
          mkdir -p build
          git bundle create build/source.bundle HEAD
          yosys -V > build/mapping_yosys_version.log
          iverilog -V > build/mapping_iverilog_version.log 2>&1
          if [ -x .tools/OpenSTA/build/sta ]; then .tools/OpenSTA/build/sta -version > build/mapping_sta_version.log; fi
      - name: Upload mapped evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flexmac-scorepipe-inputs
          path: |
            build/scorepipe/map/
            build/scorepipe/mapped_comparison.csv
            build/int8_two_lane.csv
            build/scorepipe.csv
            build/int8_two_lane.log
            build/scorepipe.log
            build/scorepipe_sources.log
            build/mapping_*version.log
            build/source.bundle
  replay:
    needs: map
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        design: [int8_two_lane, int8_two_lane_scorepipe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install simulation tools
        timeout-minutes: 12
        run: bash scripts/install_ci_tools.sh replay
      - uses: actions/download-artifact@v4
        with:
          name: flexmac-scorepipe-inputs
          path: build
      - name: Full compiled replay and separate four-state verification
        run: python scripts/check_mapped.py --study eda/scorepipe_study.json --design ${{ matrix.design }}
      - name: Preserve replay evidence and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flexmac-scorepipe-gate-${{ matrix.design }}
          path: |
            build/scorepipe/map/${{ matrix.design }}.replay.*
            build/scorepipe/map/${{ matrix.design }}.icarus.*
            build/scorepipe/map/${{ matrix.design }}.icarus_compile.log
            build/scorepipe/map/${{ matrix.design }}.verilator.log
            build/scorepipe/map/${{ matrix.design }}.conversion.log
            build/scorepipe/map/${{ matrix.design }}.gates.v
            build/scorepipe/map/${{ matrix.design }}.indices.hex
  aggregate:
    needs: [map, replay]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: flexmac-scorepipe-inputs
          path: build
      - uses: actions/download-artifact@v4
        with:
          pattern: flexmac-scorepipe-gate-*
          merge-multiple: true
          path: build/scorepipe/map
      - name: Cross-check all replay results and source hashes
        run: python scripts/check_mapped.py --study eda/scorepipe_study.json --aggregate-only
      - uses: actions/upload-artifact@v4
        with:
          name: flexmac-scorepipe-study
          path: |
            build/scorepipe/map/
            build/scorepipe/mapped_comparison.csv
            build/int8_two_lane.csv
            build/scorepipe.csv
            build/int8_two_lane.log
            build/scorepipe.log
            build/scorepipe_sources.log
            build/mapping_*version.log
            build/source.bundle
